<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bg-grad); }
    .grid { stroke: rgba(255, 255, 255, 0.05); stroke-width: 1; }
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: url(#title-grad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .tagline { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; letter-spacing: 2px; text-transform: uppercase; }
    
    /* Dynamic Animations */
    .pulse-line {
      stroke: #818cf8;
      stroke-width: 3;
      fill: none;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: dash 6s linear infinite;
    }

    .pill-capsule {
      animation: float 4s ease-in-out infinite;
    }

    .pill-capsule-2 {
      animation: float 5s ease-in-out infinite 1s;
    }

    .wave {
      animation: pulseWave 3s ease-in-out infinite alternate;
    }

    @keyframes dash {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(5deg); }
    }

    @keyframes pulseWave {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.8; transform: scale(1.02); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" class="bg" rx="16"/>

  <!-- Grid Lines -->
  <g class="grid">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="400" y1="0" x2="400" y2="350"/>
    <line x1="600" y1="0" x2="600" y2="350"/>
    <line x1="800" y1="0" x2="800" y2="350"/>
    <line x1="1000" y1="0" x2="1000" y2="350"/>
  </g>

  <!-- Dynamic Background Heartbeat / Telemetry Pulse (Background) -->
  <path class="pulse-line" d="M 50,260 L 300,260 L 330,220 L 360,300 L 390,190 L 420,280 L 440,260 L 1150,260" opacity="0.4"/>

  <!-- Floating Pills Graphics (Background dynamics) -->
  <g class="pill-capsule" transform="translate(1020, 80) rotate(-25)">
    <rect x="0" y="0" width="70" height="30" rx="15" fill="#38bdf8" opacity="0.8"/>
    <rect x="35" y="0" width="35" height="30" rx="0" fill="#818cf8" opacity="0.9"/>
    <rect x="35" y="0" width="35" height="30" rx="15" fill="#818cf8" opacity="0.9"/>
  </g>

  <g class="pill-capsule-2" transform="translate(110, 50) rotate(15)">
    <rect x="0" y="0" width="60" height="26" rx="13" fill="#c084fc" opacity="0.7"/>
    <rect x="30" y="0" width="30" height="26" rx="0" fill="#f43f5e" opacity="0.8"/>
    <rect x="30" y="0" width="30" height="26" rx="13" fill="#f43f5e" opacity="0.8"/>
  </g>

  <!-- Foreground Content (Guaranteed text clarity) -->
  <g transform="translate(80, 110)">
    <!-- Tagline -->
    <text x="0" y="20" class="tagline">💊 Curated Open-Source &amp; Enterprise Ecosystem</text>
    
    <!-- Title with Glow -->
    <text x="0" y="75" class="title" filter="url(#glow)">Awesome Medication Adherence</text>
    
    <!-- Subtitle -->
    <text x="0" y="125" class="subtitle">Platforms • Dose Tracking • Smart Devices • FHIR • Patient Engagement</text>
  </g>

  <!-- Status / Ecosystem Badges in Graphic -->
  <g transform="translate(80, 275)">
    <rect x="0" y="0" width="160" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="16" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">☁️ 14 SaaS Platforms</text>

    <rect x="175" y="0" width="180" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="191" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#818cf8">🧩 34 Open-Source Repos</text>

    <rect x="370" y="0" width="160" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="386" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#c084fc">🔥 FHIR &amp; IoT Ready</text>
  </g>
</svg>
